[tool.poetry]
name = "anil-fireworks-backend"
version = "0.1.0"
description = "x402 payment validation backend"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
py-algorand-sdk = "^2.11.0"
x402-avm = { extras = ["httpx"], version = "^2.0.0" }
supabase = "^2.0.0"
python-dotenv = "^1.0.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = ">=0.28.1"
fastapi = "^0.135.3"
uvicorn = "^0.42.0"
google-genai = "^1.70.0"
groq = "^1.1.2"

[tool.poetry.group.dev.dependencies]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
